<!--
  ============================================================
  CARA MENAMBAHKAN TESTIMONI (screenshot chat WA, dll)
  ============================================================
  1. Simpan gambar screenshot Anda dengan nama:
     testi-1.jpg, testi-2.jpg, testi-3.jpg, dst.
     (boleh .jpg atau .png, sesuaikan penulisan di bawah)

  2. Upload gambar-gambar itu ke repo GitHub yang sama
     (sejajar dengan file index.html, style.css, dll).

  3. Tambahkan satu baris di dalam array "gambarTestimoni"
     di bagian <script> paling bawah file ini, untuk setiap
     gambar baru. Urutan di array = urutan tampil di halaman.

  4. Jika mau ditampilkan di halaman bio, buka bio.html dan
     tambahkan kembali tombol menuju testimoni.html.
  ============================================================
-->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimoni Tamu — Villa Haven</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="policy-main">
  <h2>Kata Tamu Kami</h2>
  <p>Bukti percakapan dan ulasan asli dari tamu yang sudah booking villa melalui Villa Haven.</p>

  <div class="testi-gallery" id="testiGallery"></div>
  <p class="testi-empty" id="testiEmpty">Belum ada testimoni ditambahkan.</p>

  <a href="bio.html" class="policy-back">← Kembali</a>
</main>

<div id="global-footer"></div>
<script src="config.js"></script>
<script src="footer.js"></script>
<script>
  // Tambahkan nama file gambar testimoni di sini, satu per baris:
  const gambarTestimoni = [
    // "testi-1.jpg",
    // "testi-2.jpg",
  ];

  const gallery = document.getElementById('testiGallery');
  const empty = document.getElementById('testiEmpty');

  if (gambarTestimoni.length > 0) {
    empty.style.display = 'none';
    gambarTestimoni.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'Testimoni tamu Villa Haven';
      img.className = 'testi-img';
      gallery.appendChild(img);
    });
  }
</script>

</body>
</html>
